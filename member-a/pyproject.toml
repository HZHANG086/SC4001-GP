[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc4001-a"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["transformers==4.51.3", "datasets==3.5.0", "accelerate==1.6.0", "numpy==1.26.4", "pyarrow==19.0.1", "pandas==2.2.3", "safetensors==0.5.3"]

[tool.setuptools.packages.find]
where = ["src"]
